    <script>
        function getRandomInt(min, max, excludeZero = true) {
            let num = Math.floor(Math.random() * (max - min + 1)) + min;
            if (excludeZero && num === 0) return getRandomInt(min, max, excludeZero);
            return num;
        }
        function formatTerm(value, isFirst = false) {
            if (value === 0) return "";
            if (value > 0) return isFirst ? `${value}` : `＋ ${value}`;
            return isFirst ? `－${Math.abs(value)}` : `－ ${Math.abs(value)}`;
        }
        function formatXTerm(coef, isFirst = false, varChar = "x") {
            if (coef === 0) return "";
            let sign = coef > 0 ? (isFirst ? "" : "＋ ") : "－ ";
            let absCoef = Math.abs(coef);
            let coefStr = absCoef === 1 ? "" : absCoef;
            return `${sign}${coefStr}${varChar}`;

                return { q: `( x ＋ 2 )( y ＋ 3 ) ＝`, steps: [`＝ <span class="final-ans">xy ＋ 3x ＋ 2y ＋ 6</span>`] };
            }},
            "m3_1_展開公式": { title: "乗法公式を利用して、次の式を展開しなさい。", engine: function() {
                return { q: `( x ＋ 4 )² ＝`, steps: [`＝ x² ＋ 2×4×x ＋ 4²`, `＝ <span class="final-ans">x² ＋ 8x ＋ 16</span>`] };
            }},
            "m3_1_優先順位": { title: "展開と分配法則の優先順位に注意して計算せよ。", engine: function() {
                return { q: `2x² － ( x ＋ 2 )( x － 2 ) ＝`, steps: [`＝ 2x² － (<span class="diff">x² － 4</span>)`, `＝ <span class="final-ans">2x² ＋ 4</span>`] };
            }},
            "m3_1_置き換え展開": { title: "置き換え公式（Mとおく）を利用して展開せよ。", engine: function() {
                return { q: `( a ＋ b ＋ 1 )( a ＋ b － 1 ) ＝`, steps: [`a＋b ＝ M とおく`, `＝ M² － 1`, `＝ <span class="final-ans">(a ＋ b)² － 1</span>`] };
            }},
            "m3_1_展開同類": { title: "展開したのち、同類項をまとめなさい。", engine: function() {
                return { q: `(x ＋ 2)(x ＋ 3) － x(x － 1) ＝`, steps: [`＝ <span class="diff">x² ＋ 5x ＋ 6 － x² ＋ x</span>`, `＝ <span class="final-ans">6x ＋ 6</span>`] };
            }},
            "m3_1_共通くくり": { title: "共通因数をくくり出して因数分解しなさい。", engine: function() {
                return { q: `3ax ＋ 6ay ＝`, steps: [`共通な因数 3a を前に出す`, `＝ <span class="final-ans">3a( x ＋ 2y )</span>`] };
            }},
            "m3_1_因数公式": { title: "公式を適用して、次の式を因数分解しなさい。", engine: function() {
                return { q: `x² － 25 ＝`, steps: [`＝ x² － 5²`, `＝ <span class="final-ans">( x ＋ 5 )( x － 5 )</span>`] };
            }},
            "m3_1_くくり公式": { title: "先に共通因数をくくり出してから公式を適用せよ。", engine: function() {
                return { q: `2x² － 8 ＝`, steps: [`＝ 2( x² － 4 )`, `＝ <span class="final-ans">2( x ＋ 2 )( x － 2 )</span>`] };
            }},
            "m3_1_置き換え因数": { title: "置き換えを利用して因数分解しなさい。", engine: function() {
                return { q: `(x ＋ y)² － 5(x ＋ y) ＋ 6 ＝`, steps: [`x＋y を M とおく`, `＝ M² － 5M ＋ 6 ＝ (M－2)(M－3)`, `＝ <span class="final-ans">(x ＋ y － 2)(x ＋ y － 3)</span>`] };
            }},
            "m3_1_共通因数探": { title: "因数分解によって2つの式の共通因数を見つけよ。", engine: function() {
                return { q: `x²-4 と x²+2x ↳`, steps: [`(x+2)(x-2) と x(x+2)`, `<span class="final-ans">共通因数: x ＋ 2</span>`] };
            }},
            "m3_2_根号整数": { title: "次の根号を整数に直しなさい。", engine: function() {
                return { q: `√64 ＝`, steps: [`＝ √8²`, `＝ <span class="final-ans">8</span>`] };
            }},
            "m3_2_根号乗除基": { title: "根号を含む式の乗法・除法を計算しなさい。", engine: function() {
                return { q: `√3 × √7 ＝`, steps: [`＝ <span class="final-ans">√21</span>`] };
            }},
            "m3_2_平方簡易": { title: "平方根を簡略化（A√Bの形に）しなさい。", engine: function() {
                return { q: `√20 ＝`, steps: [`＝ √4 × 5`, `＝ <span class="final-ans">2√5</span>`] };
            }},
            "m3_2_自然数根号": { title: "次の自然数を根号（√ ）の中にいれなさい。", engine: function() {
                return { q: `4 ＝`, steps: [`＝ √4²`, `＝ <span class="final-ans">√16</span>`] };
            }},
            "m3_2_近似値": { title: "√3＝1.732 とするとき、√300 の値を求めよ。", engine: function() {
                return { q: `√300 ＝`, steps: [`＝ 10√3 ↳ 10 × 1.732`, `＝ <span class="final-ans">17.32</span>`] };
            }},
            "m3_2_有理化": { title: "次の式の分母を有理化しなさい。", engine: function() {
                return { q: `<div class="frac"><div class="num">3</div><div class="den">√2</div></div> ＝`, steps: [`分母と分子に √2 を掛ける`, `＝ <span class="final-ans"><div class="frac"><div class="num">3√2</div><div class="den">2</div></div></span>`] };
            }},
            "m3_2_乗除簡易有理": { title: "乗除のあと、簡易化および有理化まで行え。", engine: function() {
                return { q: `√6 × √2 ＝`, steps: [`＝ √12`, `＝ <span class="final-ans">2√3</span>`] };
            }},
            "m3_2_平方加減": { title: "平方根（同類ルート）の加減をしなさい。", engine: function() {
                return { q: `3√2 ＋ 4√2 ＝`, steps: [`＝ (3 ＋ 4)√2`, `＝ <span class="final-ans">7√2</span>`] };
            }},
            "m3_2_中身整理加減": { title: "根号の中身を整理（簡易化）してから加減せよ。", engine: function() {
                return { q: `√18 ＋ √50 ＝`, steps: [`＝ <span class="diff">3√2 ＋ 5√2</span>`, `＝ <span class="final-ans">8√2</span>`] };
            }},
            "m3_2_理同類": { title: "有理化したのち、同類項をまとめて加減せよ。", engine: function() {
                return { q: `√2 ＋ <div class="frac"><div class="num">4</div><div class="den">√2</div></div> ＝`, steps: [`＝ √2 ＋ <span class="diff">2√2</span>`, `＝ <span class="final-ans">3√2</span>`] };
            }},
            "m3_2_平方分配": { title: "平方根と分配法則の展開計算をしなさい。", engine: function() {
                return { q: `√2 ( √2 ＋ 3 ) ＝`, steps: [`＝ √2×√2 ＋ 3√2`, `＝ <span class="final-ans">2 ＋ 3√2</span>`] };
            }},
            "m3_2_平方公式": { title: "平方根と乗法公式（展開）を適用せよ。", engine: function() {
                return { q: `( √5 ＋ 1 )² ＝`, steps: [`＝ (√5)² ＋ 2√5 ＋ 1²`, `＝ 5 ＋ 2√5 ＋ 1`, `＝ <span class="final-ans">6 ＋ 2√5</span>`] };
            }},
            "m3_3_因数方程式": { title: "因数分解を利用して2次方程式を解きなさい。", engine: function() {
                let ea = getRandomInt(1, 2); let eb = getRandomInt(3, 4, false); return { q: `x² － ${ea+eb}x ＋ ${ea*eb} ＝ 0`, steps: [`左辺を因数分解して`, `( x － ${ea} )( x － ${eb} ) ＝ 0`, `<span class="final-ans">x ＝ ${ea}, ${eb}</span>`] };
            }},
            "m3_3_くくり方程式": { title: "共通因数のくくり出しを利用して解きなさい。", engine: function() {
                return { q: `x² － 3x ＝ 0`, steps: [`x(x － 3) ＝ 0`, `<span class="final-ans">x ＝ 0 , 3</span>`] };
            }},
            "m3_3_整理因数": { title: "式を整理してから因数分解せよ。", engine: function() {
                return { q: `x(x ＋ 3) ＝ 4`, steps: [`x² ＋ 3x － 4 ＝ 0 ↳ (x＋4)(x－1)＝0`, `<span class="final-ans">x ＝ 1 , －4</span>`] };
            }},
            "m3_3_解の公式": { title: "解の公式をそのまま適用して解きなさい。", engine: function() {
                return { q: `x² ＋ 3x ＋ 1 ＝ 0`, steps: [`公式に代入する`, `<span class="final-ans">x ＝ <div class="frac"><div class="num">－3 ± √5</div><div class="den">2</div></div></span>`] };
            }},
            "m3_3_公式後計算": { title: "解の公式適用後、ルートや約分の計算を行え。", engine: function() {
                return { q: `x² － 2x － 2 ＝ 0`, steps: [`x ＝ (2±√12)/2 ＝ (2±2√3)/2`, `<span class="final-ans">x ＝ 1 ± √3</span>`] };
            }},
            "m3_3_係数簡単": { title: "係数を簡単にしてから解きなさい。", engine: function() {
                return { q: `3x² － 6x － 9 ＝ 0`, steps: [`3で割る： x² － 2x － 3 ＝ 0`, `(x － 3)(x ＋ 1) ＝ 0`, `<span class="final-ans">x ＝ 3 , －1</span>`] };
            }},
            "m3_4_式座標": { title: "関数 y＝2x² で x＝－3 のときの座標は？", engine: function() {
                return { q: `y ＝ 2 × (－3)² ↳ y ＝ 18`, steps: [`<span class="final-ans">( －3 , 18 )</span>`] };
            }},
            "m3_4_座標式": { title: "点(2,12)を通る関数 y＝ax² の式を求めよ。", engine: function() {
                return { q: `12 ＝ a × 2² ↳ 12 ＝ 4a`, steps: [`<span class="final-ans">y ＝ 3x²</span>`] };
            }},
            "m3_4_放物直線": { title: "y＝x² と 直線 y＝x＋2 の交点の座標は？", engine: function() {
                return { q: `x² － x － 2 ＝ 0 ↳`, steps: [`(x－2)(x＋1)＝0`, `<span class="final-ans">( 2 , 4 ) , ( －1 , 1 )</span>`] };
            }}
        };

        function generatePrint() {
            const previewContainer = document.getElementById('main-preview-area');
            previewContainer.innerHTML = ''; 

            let selectedUnits = [];
            document.querySelectorAll('.calc-unit').forEach(cb => { if (cb.checked) selectedUnits.push(cb.value); });

            if (selectedUnits.length === 0) {
                alert('単元を1つ以上選んでください！');
                document.querySelectorAll('.calc-unit')[0].checked = true;
                selectedUnits.push(document.querySelectorAll('.calc-unit')[0].value);
            }

            let bqCount = selectedUnits.length;
            let pageCount = Math.ceil(bqCount / 6); 
            let subCount = 2; 
            
            if (bqCount === 1) subCount = 10;
            else if (bqCount === 2) subCount = 6;
            else if (bqCount === 3) subCount = 4;
            else if (bqCount === 4) subCount = 3;

            document.getElementById('layout-status').innerHTML = `大問: ${bqCount} 個 選出<br>用紙: 各 ${pageCount} 枚構成 (A4固定)`;

            let qPages = [];
            let aPages = [];
            for (let p = 0; p < pageCount; p++) {
                let qPage = document.createElement('div'); qPage.className = 'page';
                qPage.innerHTML = `<div class="sheet-header"><h1 class="sheet-title">数学計算確認ドリル（問題）- P.${p+1}</h1><div class="student-info"><div>組</div><div>番</div><div style="width:120px;">氏名：</div></div></div><div class="document-body" id="page-q-${p}"></div>`;
                qPages.push(qPage);

                let aPage = document.createElement('div'); aPage.className = 'page';
                aPage.innerHTML = `<div class="sheet-header"><h1 class="sheet-title" style="color: #e53e3e;">数学計算確認ドリル（途中式解答）- P.${p+1}</h1></div><div class="document-body" id="page-a-${p}"></div>`;
                aPages.push(aPage);
            }

            let bigQIndex = 1;
            selectedUnits.forEach((unitKey, index) => {
                let targetPageIndex = Math.floor(index / 6); 
                let unitsInThisPage = Math.min(6, bqCount - (targetPageIndex * 6)); 

                let singleBigQHeightMM = 235 / unitsInThisPage;
                let gridHeightMM = singleBigQHeightMM - 6;
                let rowCount = Math.ceil(subCount / 2);
                let singleSubItemHeightMM = gridHeightMM / rowCount;

                const targetUnit = sectionCatalog[unitKey] || sectionCatalog["m1_1_加法"];

                const bqBlockQ = document.createElement('div');
                bqBlockQ.className = 'big-question';
                bqBlockQ.style.height = `${singleBigQHeightMM}mm`;
                bqBlockQ.innerHTML = `
                    <div class="big-question-title">【大問 ${bigQIndex}】 &nbsp; ${targetUnit.title}</div>
                    <div class="sub-question-grid" id="grid-q-${bigQIndex}" style="height:${gridHeightMM}mm;"></div>
                `;

                const bqBlockA = document.createElement('div');
                bqBlockA.className = 'big-question';
                bqBlockA.style.height = `${singleBigQHeightMM}mm`;
                bqBlockA.innerHTML = `
                    <div class="big-question-title" style="color:#e53e3e;">【大問 ${bigQIndex}】 &nbsp; ${targetUnit.title}</div>
                    <div class="sub-question-grid" id="grid-a-${bigQIndex}" style="height:${gridHeightMM}mm;"></div>
                `;

                qPages[targetPageIndex].querySelector('.document-body').appendChild(bqBlockQ);
                aPages[targetPageIndex].querySelector('.document-body').appendChild(bqBlockA);

                const gridQ = qPages[targetPageIndex].querySelector(`#grid-q-${bigQIndex}`);
                const gridA = aPages[targetPageIndex].querySelector(`#grid-a-${bigQIndex}`);

                for (let subIndex = 1; subIndex <= subCount; subIndex++) {
                    let problemData = targetUnit.engine();

                    const itemQ = document.createElement('div');
                    itemQ.className = 'sub-question-item';
                    itemQ.style.height = `${singleSubItemHeightMM}mm`;
                    itemQ.innerHTML = `<div class="item-main"><span class="num-tag">（${subIndex}）</span><span class="formula">${problemData.q}</span></div>`;
                    gridQ.appendChild(itemQ);

                    let stepsHtml = "";
                    problemData.steps.forEach(step => { stepsHtml += `<div class="step-line"><span class="step-arrow">↳</span><span>${step}</span></div>`; });

                    const itemA = document.createElement('div');
                    itemA.className = 'sub-question-item';
                    itemA.style.height = `${singleSubItemHeightMM}mm`;
                    itemA.innerHTML = `<div class="item-main"><span class="num-tag">（${subIndex}）</span><span class="formula">${problemData.q}</span></div><div class="steps-area">${stepsHtml}</div>`;
                    gridA.appendChild(itemA);
                }

                bigQIndex++;
            });

            qPages.forEach(p => previewContainer.appendChild(p));
            aPages.forEach(p => previewContainer.appendChild(p));
        }

        window.onload = function() {
            generatePrint();
        };
    </script>
</body>
