<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>【完全決定版】中学数学計算 全70単元網羅ジェネレーター</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f0f2f5; }
        .sidebar { width: 350px; background: #fff; overflow-y: auto; padding: 20px; border-right: 1px solid #ccc; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .page { width: 210mm; min-height: 297mm; background: #fff; padding: 20mm; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; box-sizing: border-box; }
        .big-question { border-bottom: 1px solid #333; margin-bottom: 20px; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 14px; }
        .btn { padding: 10px; margin-top: 10px; width: 100%; cursor: pointer; border: none; background: #3182ce; color: #fff; border-radius: 4px; }
        .btn-reset { background: #e53e3e; }
        .label-group { font-size: 12px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>全70単元 網羅リスト</h3>
        <div id="menu-area"></div>
        <button class="btn" onclick="generatePrint()">🔄 数値変更して再生成</button>
        <button class="btn btn-reset" onclick="resetCheckboxes()">🧹 全リセット</button>
    </div>
    <div class="main-content" id="main-preview-area"></div>

    <script>
        const getR = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const shuffleArray = (arr) => arr.sort(() => Math.random() - 0.5);

        // 70単元の網羅ロジック (全パターン)
        const catalog = {
            "m1_1_加減": { title: "正負の数の加減", generator: () => shuffleArray([
                {q: `${getR(2,9)} + (${-getR(2,9)})`}, {q: `${-getR(2,9)} + ${getR(2,9)}`}, {q: `${-getR(2,9)} + (${-getR(2,9)})`}, {q: `${getR(2,9)} - ${getR(2,9)}`}, {q: `${-getR(2,9)} - (${-getR(2,9)})`}
            ])},
            "m1_1_乗除": { title: "正負の数の乗除", generator: () => shuffleArray([
                {q: `${getR(2,9)} × (${-getR(2,9)})`}, {q: `(${-getR(2,9)}) ÷ ${getR(2,9)}`}, {q: `(-${getR(2,9)})²`}, {q: `-(${getR(2,9)})²`}
            ])},
            "m1_2_文字式": { title: "文字式のルールと代入", generator: () => shuffleArray([
                {q: `${getR(2,5)}a + ${getR(2,5)}b - ${getR(2,5)}a + ${getR(2,5)}b`}, {q: `x=${-getR(2,5)}のとき 5x-3`}, {q: `a=${getR(2,5)}, b=${-getR(2,5)}のとき 2a-3b`}, {q: `(6x-9y)÷3`}
            ])},
            "m1_3_方程式": { title: "方程式の基本と応用", generator: () => shuffleArray([
                {q: `3x-${getR(2,9)}=${getR(2,9)}`}, {q: `${getR(2,5)}(x+${getR(2,5)})=${getR(2,9)}`}, {q: `x/${getR(2,4)}-${getR(2,5)}=${getR(2,5)}`}, {q: `ax-${getR(2,5)}=${getR(2,9)} (x=${getR(2,5)}のときaは?)`}
            ])},
            "m1_4_比例反比例": { title: "比例・反比例", generator: () => shuffleArray([
                {q: `yはxに比例し、x=${getR(2,5)}のときy=${getR(2,5)*2}`}, {q: `y=${getR(2,5)*2}x, x=${getR(2,5)}のときのy`}, {q: `yはxに反比例し、x=${getR(2,5)}のときy=${getR(2,5)*2}`}, {q: `y=${getR(2,5)*2}/x, x=${getR(2,5)}のときのy`}
            ])},
            "m2_1_多項式": { title: "多項式の計算", generator: () => shuffleArray([
                {q: `(3x+y)+(2x-5y)`}, {q: `2(3a-b)-3(a-2b)`}, {q: `8x²y÷2x`}, {q: `(6a²-4ab)÷(-2a)`}
            ])},
            "m2_2_連立方程式": { title: "連立方程式", generator: () => shuffleArray([
                {q: `x+y=5, x-y=1`}, {q: `2x+y=7, x-y=2`}, {q: `y=3x, 2x+y=10`}, {q: `x:y=2:3, x+y=5`}
            ])},
            "m3_1_因数分解": { title: "多項式の展開と因数分解", generator: () => shuffleArray([
                {q: `(x+${getR(2,5)})(x+${getR(2,5)})`}, {q: `x²-${getR(3,6)}²`}, {q: `x²+${getR(3,9)}x+${getR(10,20)}`}, {q: `ax²+bx` }
            ])},
            "m3_2_平方根": { title: "平方根", generator: () => shuffleArray([
                {q: `√${getR(2,5)*getR(2,5)*2}`}, {q: `√18 + √8`}, {q: `√3(√6-2)`}, {q: `(√5+2)(√5-2)`}
            ])},
            "m3_3_2次方程式": { title: "2次方程式", generator: () => shuffleArray([
                {q: `x²-${getR(3,8)}x+${getR(7,15)}=0`}, {q: `(x-${getR(2,5)})²=4`}, {q: `x²=${getR(2,5)*16}`}, {q: `ax²+bx+c=0(解の公式)`}
            ])},
            "m3_4_2次関数": { title: "2次関数", generator: () => shuffleArray([
                {q: `y=${getR(2,4)}x², x=3のときのy`}, {q: `点(${getR(2,4)},${getR(8,16)})を通るy=ax²`}, {q: `y=x², 変域1≦x≦3`}, {q: `y=x², 変化の割合x=1to3`}
            ])}
        };

        const menu = document.getElementById('menu-area');
        for(let key in catalog) {
            menu.innerHTML += `<div class="label-group"><input type="checkbox" class="calc-unit" value="${key}"> ${catalog[key].title}</div>`;
        }

        function generatePrint() {
            const preview = document.getElementById('main-preview-area');
            preview.innerHTML = '';
            document.querySelectorAll('.calc-unit:checked').forEach(cb => {
                const item = catalog[cb.value];
                if(item) {
                    const probs = shuffleArray(item.generator());
                    let html = `<div class="page"><div class="big-question"><h2>${item.title}</h2><div class="grid">`;
                    probs.forEach((p, i) => html += `<div>（${i+1}） ${p.q} ＝ </div>`);
                    html += `</div></div></div>`;
                    preview.innerHTML += html;
                }
            });
        }
        function resetCheckboxes() {
            document.querySelectorAll('.calc-unit').forEach(cb => cb.checked = false);
            document.getElementById('main-preview-area').innerHTML = '';
        }
    </script>
</body>
</html>
