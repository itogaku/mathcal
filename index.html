<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>中学数学・詳細単元選択計算ジェネレーター</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
            margin: 0; display: flex; height: 100vh; background: #eef2f7; color: #2d3748;
        }

        /* ---------- サイドバー ---------- */
        .sidebar {
            width: 320px; flex-shrink: 0; background: #fff; overflow-y: auto;
            padding: 20px; border-right: 1px solid #e2e8f0;
            box-shadow: 2px 0 6px rgba(0,0,0,0.03);
        }
        .sidebar h3 {
            margin: 0 0 16px; font-size: 17px; color: #1a365d;
            display: flex; align-items: center; gap: 6px;
        }
        .grade-divider {
            font-weight: bold; font-size: 13px; color: #718096; margin: 18px 0 8px;
            padding-top: 12px; border-top: 2px solid #cbd5e0; letter-spacing: 1px;
        }
        .grade-divider:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
        .cat-block {
            margin-bottom: 14px; border: 1px solid #e2e8f0; border-radius: 8px;
            overflow: hidden; background: #f8fafc;
        }
        .cat-title {
            font-weight: bold; font-size: 14px; color: #fff; background: #3182ce;
            margin: 0; padding: 8px 12px;
        }
        .cat-body { padding: 8px 10px; }
        .label-group {
            font-size: 13px; margin: 2px 0; padding: 6px 8px; border-radius: 6px;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            transition: background 0.15s;
        }
        .label-group:hover { background: #ebf4ff; }
        .label-group input { width: 16px; height: 16px; accent-color: #3182ce; cursor: pointer; }

        .btn {
            padding: 12px; margin-top: 10px; width: 100%; cursor: pointer; border: none;
            background: #3182ce; color: #fff; border-radius: 8px; font-size: 14px; font-weight: bold;
            transition: background 0.15s;
        }
        .btn:hover { background: #2b6cb0; }
        .btn-reset { background: #fff; color: #e53e3e; border: 1px solid #e53e3e; }
        .btn-reset:hover { background: #fff5f5; }
        .btn-print { background: #38a169; }
        .btn-print:hover { background: #2f855a; }
        .btn-bar { position: sticky; bottom: 0; background: #fff; padding-top: 10px; }

        /* ---------- プレビュー / 印刷ページ ---------- */
        .main-content {
            flex-grow: 1; overflow-y: auto; padding: 30px; display: flex;
            flex-direction: column; align-items: center; gap: 24px;
        }
        .empty-hint {
            color: #a0aec0; font-size: 15px; margin-top: 80px; text-align: center; line-height: 1.8;
        }
        .page {
            width: 210mm; min-height: 297mm; background: #fff; padding: 15mm;
            box-shadow: 0 1px 6px rgba(0,0,0,0.1); box-sizing: border-box;
            display: flex; flex-direction: column;
            font-family: "Yu Gothic", "Meiryo", sans-serif; color: #1a1a1a;
        }
        .page-header {
            flex: 0 0 auto;
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 2px solid #1a1a1a; padding-bottom: 8px; margin-bottom: 20px;
        }
        .page-header h2 { margin: 0; font-size: 17px; font-weight: bold; letter-spacing: 4px; }
        .page-header .meta { font-size: 13px; color: #1a1a1a; white-space: nowrap; display: flex; gap: 18px; }
        .page-header .meta .meta-blank { display: inline-block; min-width: 100px; border-bottom: 1px solid #1a1a1a; margin-left: 4px; }
        .page-body { flex: 1 1 auto; }
        .unit-block { margin-bottom: 20px; }
        .unit-title {
            font-size: 13px; font-weight: bold; color: #1a1a1a; margin: 0 0 6px;
            padding-bottom: 3px; border-bottom: 1px solid #1a1a1a;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
        .problem {
            display: flex; align-items: baseline; gap: 6px; padding: 10px 6px;
            border-bottom: 1px solid #ccc; min-height: 92px;
        }
        .problem:nth-child(odd) { border-right: 1px solid #ccc; }
        .problem-num {
            font-weight: normal; color: #1a1a1a; flex-shrink: 0; font-size: 14px;
        }
        .problem-q { font-size: 15px; line-height: 1.6; }

        /* ---------- 解答ページ ---------- */
        .ans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
        .ans-item {
            font-size: 13px; padding: 4px 6px; border-bottom: 1px solid #e2e2e2;
        }
        .ans-item:nth-child(odd) { border-right: 1px solid #e2e2e2; }
        .ans-item b { color: #1a1a1a; }

        /* ---------- 印刷時 ---------- */
        @media print {
            .sidebar, .empty-hint { display: none; }
            .main-content { padding: 0; gap: 0; }
            .page { box-shadow: none; margin: 0; page-break-after: always; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>📚 詳細単元選択</h3>
        <div id="menu-area"></div>
        <div class="btn-bar">
            <button class="btn" onclick="generatePrint()">🔄 数値変更して生成</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ 印刷する</button>
            <button class="btn btn-reset" onclick="resetCheckboxes()">🧹 全リセット</button>
        </div>
    </div>
    <div class="main-content" id="main-preview-area">
        <div class="empty-hint">← 左のメニューから単元にチェックを入れてください<br>（チェックすると自動で問題が表示されます）</div>
    </div>

    <script>
        const getR = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const shuffleArray = (arr) => arr.sort(() => Math.random() - 0.5);
        const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); return b === 0 ? a : gcd(b, a % b); };
        const reduceFrac = (num, den) => { const g = gcd(num, den) || 1; return `${num / g}/${den / g}`; };
        const fmtTerm = (n) => n >= 0 ? `+${n}` : `${n}`;
        const isPerfectSquare = (n) => { const r = Math.round(Math.sqrt(n)); return r * r === n; };
        const termC = (coef, v) => coef === 0 ? '' : coef === 1 ? `+${v}` : coef === -1 ? `-${v}` : `${fmtTerm(coef)}${v}`;
        const leadC = (coef, v) => coef === 0 ? '0' : coef === 1 ? v : coef === -1 ? `-${v}` : `${coef}${v}`;

        // 中学1〜3年の「計算」単元を細分化したデータベース（q: 問題文, a: 正しい解答）
        const catalog = {
            "【1年】正負の数": {
                "加法": { gen: () => {
                    const a1=getR(2,9), b1=getR(2,9), a2=getR(2,9), b2=getR(2,9);
                    const a3=getR(2,9), b3=getR(2,9), c3=getR(2,9);
                    return [
                        {q:`${a1}+(-${b1})`, a: a1-b1},
                        {q:`${-a2}+${b2}`, a: b2-a2},
                        {q:`(+${a3})+(-${b3})+(+${c3})`, a: a3-b3+c3}
                    ];
                }},
                "減法": { gen: () => {
                    const a1=getR(2,9), b1=getR(2,9), a2=getR(2,9), b2=getR(2,9);
                    const a3=getR(2,9), b3=getR(2,9), c3=getR(2,9);
                    return [
                        {q:`${a1}-${b1}`, a: a1-b1},
                        {q:`${-a2}-(-${b2})`, a: b2-a2},
                        {q:`(+${a3})-(+${b3})+(-${c3})`, a: a3-b3-c3}
                    ];
                }},
                "乗法": { gen: () => {
                    const a1=getR(2,9), b1=getR(2,9), a2=getR(2,9), b2=getR(2,9);
                    const a3=getR(2,5), b3=getR(2,5), c3=getR(2,5);
                    return [
                        {q:`${a1}×(-${b1})`, a: -(a1*b1)},
                        {q:`(-${a2})×(-${b2})`, a: a2*b2},
                        {q:`(-${a3})×${b3}×(-${c3})`, a: a3*b3*c3}
                    ];
                }},
                "除法": { gen: () => {
                    const d1=getR(2,9), k1=getR(2,9), d2=getR(2,9), k2=getR(2,9);
                    return [
                        {q:`${d1*k1}÷(-${d1})`, a: -k1},
                        {q:`(-${d2*k2})÷(-${d2})`, a: k2}
                    ];
                }},
                "分数を含む乗除": { gen: () => {
                    const t=[
                        ()=>{ const a=getR(2,9), b=getR(2,9), c=getR(2,9), d=getR(2,9); return {q:`(+${a}/${b})÷(-${c}/${d})`, a:`-${reduceFrac(a*d,b*c)}`}; },
                        ()=>{ const a=getR(2,9), b=getR(2,9), d=getR(2,9); return {q:`(-${a}/${b})÷${d}`, a:`-${reduceFrac(a,b*d)}`}; },
                        ()=>{ const a=getR(2,9), b=getR(2,9), c=getR(2,9), d=getR(2,9); return {q:`(+${a}/${b})÷(-${c}/${d})×(-${d})`, a: reduceFrac(a*d*d,b*c)}; }
                    ];
                    return shuffleArray(t.slice()).map(fn=>fn());
                }},
                "四則混合": { gen: () => {
                    const a1=getR(2,9), b1=getR(2,9), c1=getR(2,9);
                    const a2=getR(2,9), b2=getR(2,9), c2=getR(2,9);
                    const a3=getR(2,9), b3=getR(2,9), c3=getR(2,9);
                    return [
                        {q:`${a1}+${b1}×${c1}`, a: a1+b1*c1},
                        {q:`(${a2}+${b2})×${c2}`, a: (a2+b2)*c2},
                        {q:`${a3}×${b3}-${c3}`, a: a3*b3-c3}
                    ];
                }},
                "累乗": { gen: () => {
                    const a1=getR(2,9), a2=getR(2,9), a3=getR(2,9);
                    return [
                        {q:`(-${a1})²`, a: a1*a1},
                        {q:`-${a2}²`, a: -(a2*a2)},
                        {q:`-(-${a3})²`, a: -(a3*a3)}
                    ];
                }},
                "累乗の指数で表す": { gen: () => {
                    const a1=getR(2,9), n1=getR(2,4);
                    const a2=getR(2,9), n2=getR(2,4);
                    const sup=['','¹','²','³','⁴'];
                    return [
                        {q: Array(n1).fill(`${a1}`).join('×'), a:`${a1}${sup[n1]}`},
                        {q: Array(n2).fill(`(-${a2})`).join('×'), a:`(-${a2})${sup[n2]}`}
                    ];
                }},
                "絶対値・大小・逆数": { gen: () => {
                    const v1=getR(-15,15);
                    const rvList=[[2,3],[3,2],[6,13],[1,6],[1,5],[4,7]];
                    const rv=rvList[getR(0,rvList.length-1)];
                    const rvNeg=Math.random()<0.5;
                    const cmpA=getR(-9,9);
                    const cmpB=cmpA+getR(1,10)*(Math.random()<0.5?1:-1);
                    const intV=getR(2,9)*(Math.random()<0.5?1:-1);
                    const decTenths=getR(1,9)*2;
                    const sortVals=Array.from({length:5}, () => getR(-9,9));
                    const sortedDesc=[...sortVals].sort((a,b)=>b-a);
                    const negI=-getR(1,9), posI=getR(1,9);
                    const fN=getR(1,8), fD=fN+getR(1,8);
                    const dA=getR(1,9), dB=getR(1,9);
                    const items=[
                        {disp:`${negI}`, isNeg:true, isInt:true, isNat:false},
                        {disp:`${posI}`, isNeg:false, isInt:true, isNat:true},
                        {disp:`0`, isNeg:false, isInt:true, isNat:false},
                        {disp:`+${fN}/${fD}`, isNeg:false, isInt:false, isNat:false},
                        {disp:`-${fN}/${fD}`, isNeg:true, isInt:false, isNat:false},
                        {disp:`${dA}.${dB}`, isNeg:false, isInt:false, isNat:false}
                    ];
                    const negatives=items.filter(i=>i.isNeg).map(i=>i.disp);
                    const integers=items.filter(i=>i.isInt).map(i=>i.disp);
                    const naturals=items.filter(i=>i.isNat).map(i=>i.disp);
                    return [
                        {q:`${v1}の絶対値`, a: Math.abs(v1)},
                        {q:`${rvNeg?'-':''}${rv[0]}/${rv[1]}の逆数`, a: `${rvNeg?'-':''}${rv[1]}/${rv[0]}`},
                        {q:`${cmpA}と${cmpB}の大小を不等号で表す`, a: cmpA<cmpB?`${cmpA}<${cmpB}`:`${cmpA}>${cmpB}`},
                        {q:`${intV}の逆数`, a: reduceFrac(1,intV)},
                        {q:`${(decTenths/10).toFixed(1)}の逆数`, a: `${10/decTenths}`},
                        {q:`次の数を小さい順に並べなさい：${sortVals.join(', ')}`, a: sortedDesc.reverse().join(' < ')},
                        {q:`次の数のうち、負の数・整数・自然数をそれぞれすべて選びなさい：${shuffleArray(items.slice()).map(i=>i.disp).join(', ')}`, a: `負の数: ${negatives.length?negatives.join(', '):'なし'} / 整数: ${integers.length?integers.join(', '):'なし'} / 自然数: ${naturals.length?naturals.join(', '):'なし'}`}
                    ];
                }},
                "素因数分解": { gen: () => {
                    const primes=[2,3,5,7,11];
                    const pick=() => { let n; do { n=1; const cnt=getR(2,3); for(let i=0;i<cnt;i++) n*=primes[getR(0,primes.length-1)]; } while(n>300); return n; };
                    const factorize=(n) => { let f=[], x=n, p=2; while(x>1){ while(x%p===0){f.push(p); x/=p;} p++; } return f; };
                    const fmtFactors=(f) => { const c={}; f.forEach(p=>c[p]=(c[p]||0)+1); return Object.keys(c).sort((a,b)=>a-b).map(p=>c[p]>1?`${p}²`:`${p}`).join('×'); };
                    const n1=pick(), n2=pick();
                    return [
                        {q:`${n1}を素因数分解する`, a: fmtFactors(factorize(n1))},
                        {q:`${n2}を素因数分解する`, a: fmtFactors(factorize(n2))}
                    ];
                }},
                "素数と倍数": { gen: () => {
                    const isPrime=(n) => { if(n<2) return false; for(let i=2;i*i<=n;i++){ if(n%i===0) return false; } return true; };
                    const limit=[20,30,40,50][getR(0,3)];
                    const primesUpTo=[]; for(let i=2;i<=limit;i++){ if(isPrime(i)) primesUpTo.push(i); }
                    const nums=Array.from({length:5}, () => getR(100,999));
                    const divisor=[2,3,5][getR(0,2)];
                    const matches=nums.filter(n=>n%divisor===0);
                    return [
                        {q:`${limit}以下の素数をすべて答えなさい`, a: primesUpTo.join(', ')},
                        {q:`次の数のうち、${divisor}の倍数をすべて選びなさい：${nums.join(', ')}`, a: matches.length?matches.join(', '):'なし'}
                    ];
                }},
                "累乗を含む工夫計算": { gen: () => {
                    const a1=getR(2,5), k1=getR(2,6), mult1=getR(2,5);
                    const dividend1=a1*a1*k1;
                    const n2=getR(10,40), p2=getR(10,40), m2=-getR(10,50);
                    const a3=getR(2,9), b3=getR(2,9), d3=getR(2,9), k3=getR(2,9), c3=d3*k3;
                    const divisorAbs=getR(2,6), m4=getR(1,5), k4=getR(2,6), f4=divisorAbs*k4, p4=-(divisorAbs+m4), g4=getR(2,9);
                    const a5=getR(2,6);
                    const b6=getR(2,5), c6=getR(2,9), k6=getR(2,9), dividend6=k6*b6*b6;
                    const d7=getR(3,6), k7=getR(2,9), outer7=d7*k7, n1_7=getR(1,d7-1); let n2_7=getR(1,d7-1); if(n1_7===n2_7) n2_7=n1_7===1?2:1;
                    return [
                        {q:`(-${dividend1})÷(-${a1}²)×${mult1}`, a: k1*mult1},
                        {q:`${n2}×(${m2})-${p2}×(${m2})`, a: (n2-p2)*m2},
                        {q:`(-${a3})×${b3}-${c3}÷(-${d3})`, a: -(a3*b3)+k3},
                        {q:`${f4}÷(${p4}+${m4})+(-${g4})`, a: -k4-g4},
                        {q:`(-${a5}²)×(-${a5})²`, a: -(a5*a5*a5*a5)},
                        {q:`${dividend6}÷(-${b6})²-(-${c6})`, a: k6+c6},
                        {q:`(-${outer7})×(${n1_7}/${d7}-${n2_7}/${d7})`, a: -(k7*(n1_7-n2_7))}
                    ];
                }},
                "符号と括弧の書き換え・計算": { gen: () => {
                    const mkChain = () => {
                        const mags = [getR(2,9), getR(2,9), getR(2,9), getR(2,9)];
                        const innerSigns = [0,1,2,3].map(()=>Math.random()<0.5?1:-1);
                        const ops = [0,1,2].map(()=>Math.random()<0.5?1:-1);
                        const combined = [innerSigns[0]];
                        for(let i=1;i<4;i++) combined.push(ops[i-1]*innerSigns[i]);
                        const bracketed = mags.map((m,i)=>`(${innerSigns[i]>0?'+':'-'}${m})`).map((b,i)=> i===0?b:`${ops[i-1]>0?'+':'-'}${b}`).join('');
                        const values = combined.map((s,i)=>s*mags[i]);
                        return { bracketed, values };
                    };
                    const c1 = mkChain();
                    const unbracketed1 = `${c1.values[0]}${fmtTerm(c1.values[1])}${fmtTerm(c1.values[2])}${fmtTerm(c1.values[3])}`;
                    const c2 = mkChain();
                    const calcValue = c2.values.reduce((s,v)=>s+v, 0);
                    const v3 = [getR(2,9)*(Math.random()<0.5?1:-1), getR(2,9)*(Math.random()<0.5?1:-1), getR(2,9)*(Math.random()<0.5?1:-1), getR(2,9)*(Math.random()<0.5?1:-1)];
                    const unbracketed3 = `${v3[0]}${fmtTerm(v3[1])}${fmtTerm(v3[2])}${fmtTerm(v3[3])}`;
                    const bracketed3 = v3.map(x=>`(${fmtTerm(x)})`).join('+');
                    return [
                        {q:`次の式をカッコのない式にしなさい：${c1.bracketed}`, a: unbracketed1},
                        {q:`次の式をカッコのある式にしなさい：${unbracketed3}`, a: bracketed3},
                        {q: c2.bracketed, a: calcValue}
                    ];
                }}
            },
            "【1年】文字式": {
                "式の表し方": { gen: () => {
                    const n1=getR(2,9), n2=getR(10,50);
                    const price=getR(30,150), n3=getR(2,9);
                    const juice=getR(80,150), n4=getR(2,6), pay=getR(300,1000);
                    return [
                        {q:`xの${n1}倍`, a:`${n1}x`},
                        {q:`${n2}からaを引く`, a:`${n2}-a`},
                        {q:`${price}円の消しゴムをb個買った時の代金`, a:`${price}b円`},
                        {q:`1本${juice}円のジュースをn本買い、${pay}円出したときのおつり`, a:`${pay}-${juice}n円`}
                    ];
                }},
                "記号×÷を用いて表す": { gen: () => {
                    const t=[
                        ()=>{ const n=getR(2,9); return {q:`${n}x`, a:`x×${n}`}; },
                        ()=>({q:`a/b`, a:`a÷b`}),
                        ()=>({q:`x²+y/2`, a:`x×x+y÷2`}),
                        ()=>{ const n=getR(2,9); return {q:`3(a-b)/${n}`, a:`3×(a-b)÷${n}`}; },
                        ()=>({q:`-ab`, a:`-(a×b)`}),
                        ()=>{ const n=getR(2,9); return {q:`${n}x-y`, a:`${n}×x-y`}; }
                    ];
                    return shuffleArray(t.slice()).map(fn=>fn());
                }},
                "代入": { gen: () => {
                    const x=-getR(2,5), a=getR(2,5), b=-getR(2,5);
                    return [
                        {q:`x=${x}のとき 5x-3`, a: 5*x-3},
                        {q:`a=${a},b=${b}のとき 2a-3b`, a: 2*a-3*b}
                    ];
                }},
                "同類項": { gen: () => {
                    const c1=getR(2,5), c2=getR(2,5);
                    const xCoef = c1-1;
                    return [{q:`${c1}x+${c2}y-x+${c2}y`, a: `${xCoef===1?'':xCoef}x+${c2*2}y`}];
                }},
                "1次式の加減": { gen: () => {
                    const a1=getR(2,5), b1=getR(2,9), c1=getR(2,5), d1=getR(2,9);
                    const a2=getR(2,9), b2=getR(2,9), c2=getR(2,5), d2=getR(2,9);
                    return [
                        {q:`(${a1}x+${b1})+(${c1}x+${d1})`, a: `${a1+c1}x+${b1+d1}`},
                        {q:`(${a2}x+${b2})-(${c2}x-${d2})`, a: `${leadC(a2-c2,'x')}+${b2+d2}`}
                    ];
                }},
                "単項式の乗除": { gen: () => {
                    const a1=getR(2,9), b1=getR(2,9);
                    const d2=getR(2,9), k2=getR(2,9);
                    return [
                        {q:`${a1}x×${b1}`, a: `${a1*b1}x`},
                        {q:`${d2*k2}x÷${d2}`, a: `${k2}x`}
                    ];
                }},
                "文字式の表し方": { gen: () => {
                    const t=[
                        ()=>{ const n=getR(2,9); return {q:`x×${n}`, a:`${n}x`}; },
                        ()=>({q:`a×(-1)`, a:`-a`}),

        function paginate(sectionHtmlList, titleText, showMeta) {
            if (sectionHtmlList.length === 0) return [''];

            // ページ本文に使える高さと幅を、実際のflexレイアウトで計測する
            const pageWrap = document.createElement('div');
            pageWrap.style.position = 'absolute';
            pageWrap.style.visibility = 'hidden';
            pageWrap.style.left = '-99999px';
            pageWrap.style.top = '0';
            pageWrap.innerHTML = wrapPage('', titleText, showMeta);
            document.body.appendChild(pageWrap);
            const pageBodyEl = pageWrap.querySelector('.page-body');
            const maxHeight = pageBodyEl.clientHeight;
            const contentWidth = pageBodyEl.clientWidth;
            document.body.removeChild(pageWrap);

            // 各セクションの実際の高さは、flex-growの影響を受けない
            // 通常のブロック要素（同じ幅）で個別に計測する
            const measureEl = document.createElement('div');
            measureEl.style.position = 'absolute';
            measureEl.style.visibility = 'hidden';
            measureEl.style.left = '-99999px';
            measureEl.style.top = '0';
            measureEl.style.width = contentWidth + 'px';
            document.body.appendChild(measureEl);
            const heights = sectionHtmlList.map(html => {
                measureEl.innerHTML = html;
                return measureEl.scrollHeight;
            });
            document.body.removeChild(measureEl);

            const pages = [];
            let current = '';
            let currentHeight = 0;
            sectionHtmlList.forEach((html, i) => {
                const h = heights[i];
                if (currentHeight > 0 && currentHeight + h > maxHeight) {
                    pages.push(current);
                    current = html;
                    currentHeight = h;
                } else {
                    current += html;
                    currentHeight += h;
                }
            });
            if (current) pages.push(current);
            return pages.length ? pages : [''];
        }

        function generatePrint() {
            const preview = document.getElementById('main-preview-area');
            const checked = document.querySelectorAll('.calc-unit:checked');
            if (checked.length === 0) {
                preview.innerHTML = emptyHint;
                return;
            }

            let counter = 0;
            const sections = [];
            checked.forEach(cb => {
                const cat = cb.dataset.cat;
                const sub = cb.dataset.sub;
                const probs = shuffleArray(catalog[cat][sub].gen());
                const items = probs.map(p => ({ num: ++counter, q: p.q, a: p.a }));
                sections.push({ cat, sub, items });
            });

            const problemHtmlList = sections.map(problemSectionHTML);
            const answerHtmlList = sections.map(answerSectionHTML);

            const problemPages = paginate(problemHtmlList, '計算プリント', true);
            const answerPages = paginate(answerHtmlList, '解答', false);

            let out = '';
            problemPages.forEach((body, i) => {
                const title = problemPages.length > 1 ? `計算プリント（${i+1}/${problemPages.length}）` : '計算プリント';
                out += wrapPage(body, title, true);
            });
            answerPages.forEach((body, i) => {
                const title = answerPages.length > 1 ? `解答（${i+1}/${answerPages.length}）` : '解答';
                out += wrapPage(body, title, false);
            });
            preview.innerHTML = out;
        }

        function resetCheckboxes() {
            document.querySelectorAll('.calc-unit').forEach(cb => cb.checked = false);
            document.getElementById('main-preview-area').innerHTML = emptyHint;
        }
    </script>
</body>
