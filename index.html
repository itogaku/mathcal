<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>中学数学全70単元・完全網羅計算ジェネレーター</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f0f2f5; }
        .sidebar { width: 350px; background: #fff; overflow-y: auto; padding: 20px; border-right: 1px solid #ccc; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .page { width: 210mm; min-height: 297mm; background: #fff; padding: 15mm; margin-bottom: 20px; box-shadow: 0 0 5px rgba(0,0,0,0.1); box-sizing: border-box; }
        .big-question { border-bottom: 1px solid #333; margin-bottom: 20px; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; font-size: 13px; }
        .btn { padding: 10px; margin-top: 10px; width: 100%; cursor: pointer; border: none; background: #3182ce; color: #fff; border-radius: 4px; }
        .btn-reset { background: #e53e3e; }
        .label-group { font-size: 11px; margin: 3px 0; display: flex; align-items: center; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>全単元 網羅リスト</h3>
        <div id="menu-area"></div>
        <button class="btn" onclick="generatePrint()">🔄 数値変更して再生成</button>
        <button class="btn btn-reset" onclick="resetCheckboxes()">🧹 全リセット</button>
    </div>
    <div class="main-content" id="main-preview-area"></div>

    <script>
        const getR = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const shuffleArray = (arr) => arr.sort(() => Math.random() - 0.5);

        // --- 全単元ロジック定義 ---
        const catalog = {
            "m1_1_正負の数": { title: "中1：正負の数 全問題", gen: () => shuffleArray([
        // 絶対値・大小
                {q: "次の数について答えよ: +7/3, -2500, +3.12, +4, 13, -20, -3/11, 0. 負の数をすべて選べ"},
                {q: "次の数について答えよ: +7/3, -2500, +3.12, +4, 13, -20, -3/11, 0. 整数をすべて選べ"},
                {q: "次の数について答えよ: +7/3, -2500, +3.12, +4, 13, -20, -3/11, 0. 自然数を選べ"},
                {q: "絶対値を答えよ: -12, 0"},
                {q: "大小を不等号で表せ: -6, 0, +4, -5, 7"},
                // 計算
                {q: "(+2)+(-5)"}, {q: "(-4)+(-7)"}, {q: "(+2)+(-4)+(+5)"}, {q: "(+2)-(+3)"}, {q: "(-6)-(-4)"},
                // カッコの変形
                {q: "(+10)-(+9)+(-8)-(-7) をカッコのない式に"}, {q: "9-3-4+2 をカッコのある式に"}, {q: "-4-(-2)+5-4 をカッコのある式に"},
                {q: "(+10)-(-2)+(-3)-(-4)"}, {q: "1+5-9-4"}, {q: "10-(-3)-(+4)-7"},
                // 乗除
                {q: "(-3)×(+7)"}, {q: "(-6)×(-4)"}, {q: "-3×2"}, {q: "(-2)×(-1)×13×(-5)"},
                {q: "累乗: 2×2×2×2を指数で"}, {q: "累乗: (-5)×(-5)×(-5)を指数で"},
                {q: "(-4)²"}, {q: "-4²"}, {q: "-(-4)²"},
                {q: "逆数: -6/13"}, {q: "逆数: 3"}, {q: "逆数: 1/6"}, {q: "逆数: 0.2"},
                {q: "(+21)÷(-7)"}, {q: "(-27)÷(-9)"}, {q: "(+5/7)÷(-5/3)"}, {q: "(-4/3)÷4"},
                // 混合
                {q: "(+7/12)÷(-5/3)×(-4)"}, {q: "(-3²)×(-3)²"}, {q: "-27÷(-3²)×5"},
                {q: "(-4)×5-9÷(-3)"}, {q: "12÷(-6+2)+(-7)"}, {q: "20÷(-2)²-(-6)"},
                {q: "(-12)×(5/6-1/2)"}, {q: "23×(-31)-13×(-31)"}, {q: "102×(-62)"},
                // 自然数・整数判定
                {q: "(自然数)+(自然数)はすべて自然数か？"}, {q: "(自然数)-(自然数)はすべて自然数か？"},
                {q: "(整数)+(整数)はすべて整数か？"}, {q: "(整数)÷(整数)はすべて整数か？"},
                // 素数
                {q: "30以下の素数をすべて答えよ"},
                {q: "321, 402, 525, 111, 810 のうち 2の倍数を選べ"},
                {q: "321, 402, 525, 111, 810 のうち 3の倍数を選べ"},
                {q: "321, 402, 525, 111, 810 のうち 5の倍数を選べ"},
                {q: "素因数分解: 30, 24, 88, 180"}
            ])}
            "m1_2_文字式": { title: "中1：文字式 全問題", gen: () => shuffleArray([
                // 文字式で表せ
                {q: "xの5倍"}, {q: "10からaを引いた数"}, {q: "70円の消しゴムをb個買った代金"}, {q: "100円のジュースをn本買い、500円出したおつり"},
                // ルールに従う
                {q: "x×5"}, {q: "a×(-1)"}, {q: "b×(-2)×a"}, {q: "x×x"}, {q: "(a+b)×3"}, {q: "(x-y)×(-7)"}, {q: "x÷4"}, {q: "a÷(-3)"}, {q: "(a-b)÷10"}, {q: "2×x+1"}, {q: "3×a-b×5"}, {q: "5×(x+2)÷4"},
                // 記号を用いて表せ
                {q: "3x を × で表せ"}, {q: "a/b を ÷ で表せ"}, {q: "x²+y/2 を記号で"}, {q: "3(a-b)/10 を記号で"},
                // 速さ・時間・道のり
                {q: "x kmの道のりを5時間で移動する速さ"}, {q: "分速a mで12m移動する時間"}, {q: "秒速v cmでt秒移動する道のり"},
                // 割合
                {q: "Aの11%"}, {q: "Bの8割"}, {q: "500のd%"}, {q: "Eのf割"},
                // 数の表し方
                {q: "10の位がx, 1の位がyの2桁の数"}, {q: "100の位がa, 10の位がb, 1の位がcの3桁の数"},
                // 整数nを用いた表し方
                {q: "7の倍数"}, {q: "10で割り切れる数"}, {q: "偶数"}, {q: "奇数"},
                // 図形と応用
                {q: "半径5cmの円の周の長さをπを使って"}, {q: "半径rの円の面積をπを使って"},
                // 値の代入
                {q: "x=-2のとき x+5"}, {q: "x=-2のとき 12/x"}, {q: "x=-2のとき 2-2x"}, {q: "x=-2のとき (-x)²"},
                {q: "x=2, y=-3のとき x+3y"}, {q: "x=2, y=-3のとき xy²"}, {q: "x=2, y=-3のとき -6xy"}, {q: "x=2, y=-3のとき 5x+y²"},
                // 係数
                {q: "-12a のaの係数"}, {q: "-10x-y のyの係数"},
                // 計算
                {q: "2x+5x"}, {q: "12x-5-x-7"}, {q: "(6a-1)+(-7a-9)"}, {q: "(20x+2)-(20x-5)"},
                {q: "3x×7"}, {q: "(-24a)÷(-8)"}, {q: "5(x+4)"}, {q: "(-35a+10)÷(-5)"},
                {q: "(3x+10)/3 × 12"}, {q: "3(2x-1)-2(x-5)"},
                // 等式
                {q: "nの5倍に10を足すとx"}, {q: "a円を5000円で買ったおつりがb円"},
                {q: "1000mを分速vmで60分"}, {q: "31をxで割ると商が5余りが1"},
                // 不等式
                {q: "10のx倍はx+10より大きい"}, {q: "120円のりんごx個と80円のみかんy個はリンゴが安い"}
            ])}
            "m1_3_方程式": { title: "中1：方程式 全問題", gen: () => shuffleArray([
                // 基本の解
                {q: "x-8=1"}, {q: "x+4=-3"}, {q: "21-x=1"}, {q: "6x=-42"}, {q: "-4x=-16"}, {q: "x/5=8"}, {q: "5x-1=14"},
                // 複雑な解・分配法則
                {q: "-2x-24=4x"}, {q: "8x-8=3x+12"}, {q: "2(x-3)=10"}, {q: "25+3(3x+1)=5x"},
                // 小数・分数
                {q: "0.2x+0.7=2.3"}, {q: "1/3x-5=1/2x-2/3"}, {q: "(x-3)/2=1/4x+3"}, {q: "(2x-1)/3=3x+2"},
                // 比例式
                {q: "15:x=5:2"}, {q: "3x:(x-3)=4:1"},
                // aの値を求める
                {q: "ax-7=9 の解がx=4のときa"}, {q: "-2x-5=3a+11 の解がx=4のときa"},
                // 文章題
                {q: "1000円で130円のケーキをいくつか買い、おつりが220円。個数は？"},
                {q: "11歳のAさんの3倍がお母さんの年齢41歳と同じになるのは何年後？"},
                {q: "あめを1人3個ずつ配ると5個余り、4個ずつ配ると6個足りない。生徒数は？"},
                {q: "あめを1人3個ずつ配ると5個余り、4個ずつ配ると6個足りない。あめの個数は？"},
                {q: "家から1200m。分速80mで歩き、途中から分速120mで8分走り図書館へ。歩いた時間は？"},
                {q: "弟が家を出て5分後に兄が家を出る。弟分速80m、兄分速120m。兄は何分後に追いつく？"},
                {q: "生徒320人が部活をしており、全生徒の80%。全生徒数は？"},
                {q: "小麦粉と砂糖を7:2で混ぜる。小麦粉420gのとき砂糖は何g？"}
            ])}
            "m2_1_式の計算": { title: "中2：式の計算 全問題", gen: () => shuffleArray([
                // 係数
                {q: "-2x-y+10 のx,yの係数"},
                // 同類項
                {q: "4a+7b+2a-4b"}, {q: "5x²+x-3x-5x²"}, {q: "xy+3y-y+3xy"}, {q: "2r+2r²+4-2r+4r"},
                // 足し引き
                {q: "A=3a-b, B=5a+2bのとき A+BとA-B"}, {q: "A=2x²+xy-10, B=3x²-2xy-1のとき A+BとA-B"},
                // 計算
                {q: "-5(-x+3y)"}, {q: "(16a²-32a+4)÷(-4)"}, {q: "4(a+5b)-3(-3a+2b)"}, 
                {q: "2/5(3x+2y)-1/2(x-y)"}, {q: "(5x-2y)/4-(3x-y)/3"}, {q: "2x-y-(3x-y)/2"},
                // 乗除
                {q: "2a×(-5b)"}, {q: "6x²y×(-3xyz)"}, {q: "54xy÷9y"}, {q: "a³÷a⁵"}, 
                {q: "16a³÷4a²×(-a)"}, {q: "(-3y)²×2xy÷3x²y"},
                // 値の代入
                {q: "x=3, y=-4のとき 8x-5y-7x+4y"}, {q: "x=3, y=-4のとき 5(5x-2y)+6(-4x+2y)"}, {q: "x=3, y=-4のとき 12xy²÷8xy×2x"},
                // 等式変形
                {q: "x+5y=7をxについて"}, {q: "5ab=-8をbについて"}, {q: "3x=2y+1をxについて"}, 
                {q: "3x+7y=2をyについて"}, {q: "V=1/3Shをhについて"}, {q: "4(x-y)=7をyについて"},
                // 説明問題
                {q: "偶数に12を足すと偶数になることを説明せよ"}
            ])},
            "m2_2_連立方程式": { title: "中2：連立方程式 全問題", gen: () => shuffleArray([
                // 基本
                {q: "5x+y=8, x-y=4"}, {q: "3x+y=2, 3x-3y=6"}, {q: "3x-2y=5, x+y=5"}, 
                {q: "2x-3y=7, -5x+4y=-7"}, {q: "y=-2x, x+2y=12"}, {q: "x=2y-1, 2x+y=8"},
                // 複雑
                {q: "4x-y+7=x+y, x+2y=-5"}, {q: "2x+3y=-11, x-2(x-y)=-2y"}, {q: "0.2x+y=-0.8, 2x+y=10"},
                {q: "x+y=-1, 1/3x+1/2y=1"}, {q: "300x-200y=-2200, 3x+4y=10"}, {q: "2x+3y=3x+2y=10"},
                // 応用
                {q: "ax-by=7, bx+ay=-2 の解が(4,-1)のとき a,b"},
                // 文章題
                {q: "和が7, 大きい方から小さい方の2倍を引くと8。2つの自然数は？"},
                {q: "120円リンゴと80円ミカンを合わせて10個、合計920円。各何個？"},
                {q: "1000mの道のり。歩き(80m/分)と走り(120m/分)で10分。距離は？"},
                {q: "2桁の整数。十の位と一の位の和は9。入れ替えると元より27大きい。整数は？"},
                {q: "去年の男女合計220人。今年は男子10%増、女子20%減で合計14人減った。去年の人数は？"}
            ])}
            "m3_1_多項式": { title: "中3：多項式・展開・因数分解", gen: () => shuffleArray([
                {q: "3x(x-2y)"}, {q: "(-21xy+6x)÷(-3x)"}, {q: "2x(x-y)-x(3x+2y)"}, {q: "(2x-1)(1+3y)"},
                {q: "(x+4)(x+6)"}, {q: "(a-6b)(a+2b)"}, {q: "(x+3)²"}, {q: "(x-5y)²"}, {q: "(x+7)(x-7)"},
                {q: "(2a+3b)(2a-3b)"}, {q: "3(x+2)(x-4)"}, {q: "-2(x+3)²"}, {q: "(x+y+4)(x+y+3)"}, {q: "(x-3)²+(x+5)(x-5)"},
                // 因数分解
                {q: "2xy-5x"}, {q: "10a²b+15ab"}, {q: "x²+8x+15"}, {q: "x²-13xy+36y²"}, {q: "x²+8x+16"},
                {q: "x²-64"}, {q: "4a²-16b²"}, {q: "ax²-ax-12a"}, {q: "(x+y)²-5(x+y)+6"},
                // 工夫と値
                {q: "1002²"}, {q: "101×99"}, {q: "33²-23²"}, {q: "x=20のとき (x+2)(x-2)"}
            ])},
            "m3_2_平方根": { title: "中3：平方根", gen: () => shuffleArray([
                {q: "49, 169, 0, 26の平方根"}, {q: "√172, √16を根号を使わずに"}, {q: "大小比較: 6と√10, 7と√50"},
                {q: "2<a<10を満たす自然数a"}, {q: "有理数と無理数分け: -20, 5, √17, 0.23, √1/100, π"},
                {q: "√12, √24, √1325を簡単に"}, {q: "√2=1.41として √8, √200, √0.02の近似値"},
                {q: "分母の有理化: 5/√7, 3/√11, 2/√56, 7/√72"},
                {q: "計算: √6×√35, √26×√53, √24×√18"},
                {q: "計算: √5+2√7, 3√2+√5+4√2-4√5, √50-√18"},
                {q: "計算: 3(√6-2√2), (√3+√17)(√3-√17)"}
            ])},
            "m3_3_2次方程式": { title: "中3：2次方程式", gen: () => shuffleArray([
                {q: "x²=36, x²=8, x²-2=0, 5x²=30"}, {q: "(x-1)²=4, (x+3)²=2"},
                {q: "x²+4x=-2 (平方完成)"}, {q: "x²-5x-14=0"}, {q: "x²+x-12=0"},
                {q: "x²-64=0"}, {q: "x²-x=0"}, {q: "4x²+3x-2=0 (解の公式)"},
                {q: "x²+x-5=0"}, {q: "2x²+4x-3=0"}, {q: "(3-x)(9-x)=16"},
                // 応用
                {q: "x²+ax-20=0の解がx=4のときa"}, {q: "x²+ax+b=0の解が2,4のときa,b"},
                {q: "2つの整数和がx..., 積が28. 整数は？"}, {q: "正方形の縦2cm長く横3cm短くで面積50. 元の長さは？"},
                {q: "地上から秒速20mで打ち上げた物体の高さ(20x-x²)について, 高さ15mになるのは？"}
            ])}
        };

        // メニュー描画
        const menu = document.getElementById('menu-area');
        for(let key in catalog) {
            menu.innerHTML += `<label class="label-group"><input type="checkbox" class="calc-unit" value="${key}" onchange="generatePrint()"> ${key}</label>`;
        }

        function generatePrint() {
            const preview = document.getElementById('main-preview-area');
            preview.innerHTML = '';
            document.querySelectorAll('.calc-unit:checked').forEach(cb => {
                const item = catalog[cb.value];
                const probs = shuffleArray(item.gen());
                let html = `<div class="page"><div class="big-question"><h2>${item.title}</h2><div class="grid">`;
                probs.forEach((p, i) => html += `<div>（${i+1}） ${p.q} ＝ </div>`);
                html += `</div></div></div>`;
                preview.innerHTML += html;
            });
        }
        function resetCheckboxes() {
            document.querySelectorAll('.calc-unit').forEach(cb => cb.checked = false);
            document.getElementById('main-preview-area').innerHTML = '';
        }
    </script>
</body>
</html>
