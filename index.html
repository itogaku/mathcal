        // 定義漏れしていたヘルパー関数
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const sectionCatalog = {
            "m1_1_加法": { title: "次の加法を計算しなさい。", generator: function() {
                let p1 = getRandomInt(2, 8); let p2 = getRandomInt(2, 8); let n1 = getRandomInt(-8, -2); let n2 = getRandomInt(-8, -2);

            "m3_4_座標式": { title: "座標から関数の決定をしなさい。", generator: function() {
                return [
                    { q: `点 ( 2 , 8 ) を通る関数 y＝ax² の式 ↳`, steps: [`8 ＝ a × 2² ↳ a ＝ 2`, `<span class="final-ans">y ＝ 2x²</span>`] },
                    { q: `点 ( 3 , －18 ) を通る関数 y＝ax² の式 ↳`, steps: [`－18 ＝ a × 3² ↳ a ＝ －2`, `<span class="final-ans">y ＝ －2x²</span>`] },
                    { q: `点 ( －4 , 16 ) を通る関数 y＝ax² の式 ↳`, steps: [`16 ＝ a × (－4)² ↳ a ＝ 1`, `<span class="final-ans">y ＝ x²</span>`] },
                    { q: `点 ( 3 , 3 ) を通る関数 y＝ax² の式 ↳`, steps: [`3 ＝ a × 3² ↳ a ＝ 1/3`, `<span class="final-ans">y ＝ <div class="frac"><div class="num">1</div><div class="den">3</div></div>x²</span>`] }
                ];
            }},
            "m3_4_放物直線": { title: "直線と放物線の交点を求めなさい。", generator: function() {
                return [
                    { q: `y ＝ x² &nbsp;と&nbsp; y ＝ x ＋ 2 &nbsp;の交点 ↳`, steps: [`連立： x² － x － 2 ＝ 0`, `<span class="final-ans">( 2 , 4 ) , ( －1 , 1 )</span>`] },
                    { q: `y ＝ 2x² &nbsp;と&nbsp; y ＝ 4x &nbsp;の交点 ↳`, steps: [`連立： 2x² － 4x ＝ 0`, `<span class="final-ans">( 0 , 0 ) , ( 2 , 8 )</span>`] },
                    { q: `y ＝ x² &nbsp;と&nbsp; y ＝ －2x ＋ 3 &nbsp;の交点 ↳`, steps: [`連立： x² ＋ 2x － 3 ＝ 0`, `<span class="final-ans">( 1 , 1 ) , ( －3 , 9 )</span>`] },
                    { q: `y ＝ －x² &nbsp;と&nbsp; y ＝ 2x － 3 &nbsp;の交点 ↳`, steps: [`連立： x² ＋ 2x － 3 ＝ 0`, `<span class="final-ans">( 1 , －1 ) , ( －3 , －9 )</span>`] }
                ];
            }}
        };

        function generatePrint() {
            const previewContainer = document.getElementById('main-preview-area');
            previewContainer.innerHTML = ''; 

            let selectedUnits = [];
            document.querySelectorAll('.calc-unit').forEach(cb => { if (cb.checked) selectedUnits.push(cb.value); });

            if (selectedUnits.length === 0) {
                document.getElementById('layout-status').innerText = "大問 0 個";
                return;
            }

            let bqCount = selectedUnits.length;
            let pageCount = Math.ceil(bqCount / 6); 
            let subCount = 4; 

            document.getElementById('layout-status').innerHTML = `大問: ${bqCount} 個 選出<br>用紙: 各 ${pageCount} 枚構成 (A4固定)`;

            let qPages = [];
            let aPages = [];
            for (let p = 0; p < pageCount; p++) {
                let qPage = document.createElement('div'); qPage.className = 'page';
                qPage.innerHTML = `<div class="sheet-header"><h1 class="sheet-title">数学計算確認ドリル（問題）- P.${p+1}</h1><div class="student-info"><div>組</div><div>番</div><div style="width:120px;">氏名：</div></div></div><div class="document-body" id="page-q-${p}"></div>`;
                qPages.push(qPage);

                let aPage = document.createElement('div'); aPage.className = 'page';
                aPage.innerHTML = `<div class="sheet-header"><h1 class="sheet-title" style="color: #e53e3e;">数学計算確認ドリル（途中式解答）- P.${p+1}</h1></div><div class="document-body" id="page-a-${p}"></div>`;
                aPages.push(aPage);
            }

            let bigQIndex = 1;
            selectedUnits.forEach((unitKey, index) => {
                let targetPageIndex = Math.floor(index / 6); 
                let unitsInThisPage = Math.min(6, bqCount - (targetPageIndex * 6)); 

                let singleBigQHeightMM = 235 / unitsInThisPage;

                const targetUnit = sectionCatalog[unitKey] || sectionCatalog["m1_1_加法"];
                let problemSet = targetUnit.generator(); 

                const bqBlockQ = document.createElement('div');
                bqBlockQ.className = 'big-question';
                bqBlockQ.style.minHeight = `${singleBigQHeightMM}mm`; 
                bqBlockQ.innerHTML = `
                    <div class="big-question-title">【大問 ${bigQIndex}】 &nbsp; ${targetUnit.title}</div>
                    <div class="sub-question-grid" id="grid-q-${bigQIndex}"></div>
                `;

                const bqBlockA = document.createElement('div');
                bqBlockA.className = 'big-question';
                bqBlockA.style.minHeight = `${singleBigQHeightMM}mm`; 
                bqBlockA.innerHTML = `
                    <div class="big-question-title" style="color:#e53e3e;">【大問 ${bigQIndex}】 &nbsp; ${targetUnit.title}</div>
                    <div class="sub-question-grid" id="grid-a-${bigQIndex}"></div>
                `;

                qPages[targetPageIndex].querySelector('.document-body').appendChild(bqBlockQ);
                aPages[targetPageIndex].querySelector('.document-body').appendChild(bqBlockA);

                const gridQ = qPages[targetPageIndex].querySelector(`#grid-q-${bigQIndex}`);
                const gridA = aPages[targetPageIndex].querySelector(`#grid-a-${bigQIndex}`);

                for (let subIndex = 1; subIndex <= subCount; subIndex++) {
                    let problemData = problemSet[subIndex - 1]; 

                    const itemQ = document.createElement('div');
                    itemQ.className = 'sub-question-item';
                    itemQ.innerHTML = `<div class="item-main"><span class="num-tag">（${subIndex}）</span><span class="formula">${problemData.q}</span></div>`;
                    gridQ.appendChild(itemQ);

                    let stepsHtml = "";
                    problemData.steps.forEach(step => { stepsHtml += `<div class="step-line"><span class="step-arrow">↳</span><span>${step}</span></div>`; });

                    const itemA = document.createElement('div');
                    itemA.className = 'sub-question-item';
                    itemA.innerHTML = `<div class="item-main"><span class="num-tag">（${subIndex}）</span><span class="formula">${problemData.q}</span></div><div class="steps-area">${stepsHtml}</div>`;
                    gridA.appendChild(itemA);
                }

                bigQIndex++;
            });

            qPages.forEach(p => previewContainer.appendChild(p));
            aPages.forEach(p => previewContainer.appendChild(p));
        }

        window.onload = function() {
            generatePrint();
        };
    </script>
</body>
</html>
