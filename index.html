<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>【完全動的生成】中学数学計算プリントジェネレーター</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f0f2f5; }
        .sidebar { width: 300px; background: #fff; overflow-y: auto; padding: 20px; border-right: 1px solid #ccc; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .page { width: 210mm; min-height: 297mm; background: #fff; padding: 20mm; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .big-question { margin-bottom: 20px; }
        .sub-question-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .btn { padding: 10px; margin-top: 10px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>計算単元選択</h3>
        <div id="menu-area"></div>
        <button class="btn" onclick="generatePrint()">🔄 数値変更して生成</button>
        <button class="btn" onclick="resetCheckboxes()">🧹 全リセット</button>
    </div>
    <div class="main-content" id="main-preview-area"></div>

    <script>
        // 乱数生成器
        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        
        // 全単元データ（数値生成ロジック付き）
        const catalog = {
            "m1_1_加法": { title: "正負の数の加法", generator: () => [
                { q: `${getRandomInt(2,9)} + (${-getRandomInt(2,9)})`, steps: ["符号を整理して加える"] },
                { q: `${-getRandomInt(2,9)} + ${getRandomInt(2,9)}`, steps: ["絶対値の差を求める"] }
            ]},
            "m2_1_多項加減": { title: "多項式の加減", generator: () => [
                { q: `(3x + y) + (2x - 4y)`, steps: ["同類項をまとめる"] },
                { q: `(5a - 2b) - (3a - 5b)`, steps: ["カッコを外して符号反転"] }
            ]},
            "m3_3_2次方程式": { title: "2次方程式", generator: () => [
                { q: `x² + ${getRandomInt(2,8)}x + ${getRandomInt(2,8)*1} = 0`, steps: ["因数分解の公式を使う"] }
            ]}
        };

        // UI初期化
        const menu = document.getElementById('menu-area');
        for(let key in catalog) {
            menu.innerHTML += `<div><input type="checkbox" class="calc-unit" value="${key}" onchange="generatePrint()"> ${catalog[key].title}</div>`;
        }

        function generatePrint() {
            const preview = document.getElementById('main-preview-area');
            preview.innerHTML = '';
            document.querySelectorAll('.calc-unit:checked').forEach(cb => {
                const item = catalog[cb.value];
                if(item) {
                    const problems = item.generator();
                    let html = `<div class="page"><div class="big-question"><h2>${item.title}</h2><div class="sub-question-grid">`;
                    problems.forEach((p, i) => {
                        html += `<div>（${i+1}） ${p.q}</div>`;
                    });
                    html += `</div></div></div>`;
                    preview.innerHTML += html;
                }
            });
        }
        function resetCheckboxes() {
            document.querySelectorAll('.calc-unit').forEach(cb => cb.checked = false);
            document.getElementById('main-preview-area').innerHTML = '';
        }
    </script>
</body>
</html>
