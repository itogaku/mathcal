<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>中学数学・詳細単元選択計算ジェネレーター</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f0f2f5; }
        .sidebar { width: 350px; background: #fff; overflow-y: auto; padding: 20px; border-right: 1px solid #ccc; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .page { width: 210mm; min-height: 297mm; background: #fff; padding: 15mm; margin-bottom: 20px; box-shadow: 0 0 5px rgba(0,0,0,0.1); box-sizing: border-box; }
        .big-question { border-bottom: 1px solid #333; margin-bottom: 20px; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
        .btn { padding: 10px; margin-top: 10px; width: 100%; cursor: pointer; border: none; background: #3182ce; color: #fff; border-radius: 4px; }
        .btn-reset { background: #e53e3e; }
        .cat-title { font-weight: bold; margin-top: 15px; color: #2b6cb0; border-bottom: 1px solid #ccc; }
        .label-group { font-size: 12px; margin: 3px 0; display: block; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>詳細単元選択</h3>
        <div id="menu-area"></div>
        <button class="btn" onclick="generatePrint()">🔄 数値変更して生成</button>
        <button class="btn btn-reset" onclick="resetCheckboxes()">🧹 全リセット</button>
    </div>
    <div class="main-content" id="main-preview-area"></div>

    <script>
        const getR = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const shuffleArray = (arr) => arr.sort(() => Math.random() - 0.5);

        // 70単元レベルに細分化したデータベース
        const catalog = {
            "正負の数": {
                "加法": { gen: () => [{q:`${getR(2,9)}+(-${getR(2,9)})`}, {q:`${-getR(2,9)}+${getR(2,9)}`}]},
                "減法": { gen: () => [{q:`${getR(2,9)}-${getR(2,9)}`}, {q:`${-getR(2,9)}-(-${getR(2,9)})`}]},
                "乗法": { gen: () => [{q:`${getR(2,9)}×(-${getR(2,9)})`}, {q:`(-${getR(2,9)})×(-${getR(2,9)})`}]},
                "除法": { gen: () => [{q:`${getR(2,9)}÷(-${getR(2,9)})`}, {q:`(-${getR(2,9)})÷(-${getR(2,9)})`}]}
            },
            "文字式": {
                "式の表し方": { gen: () => [{q:`xの${getR(2,9)}倍`}, {q:`${getR(10,50)}からaを引く`}]},
                "代入": { gen: () => [{q:`x=${-getR(2,5)}のとき 5x-3`}, {q:`a=${getR(2,5)},b=${-getR(2,5)}のとき 2a-3b`}]},
                "同類項": { gen: () => [{q:`${getR(2,5)}x+${getR(2,5)}y-x+${getR(2,5)}y`}]}
            },
            "方程式": {
                "基本解法": { gen: () => [{q:`x-${getR(2,9)}=${getR(2,9)}`}, {q:`${getR(2,5)}x+${getR(2,5)}=${getR(2,9)}`}]},
                "分配・分数": { gen: () => [{q:`${getR(2,5)}(x+${getR(2,5)})=${getR(2,9)}`}, {q:`x/${getR(2,4)}-${getR(2,5)}=1`}]}
            },
            "多項式展開因数分解": {
                "展開": { gen: () => [{q:`(x+${getR(2,5)})(x+${getR(2,5)})`}, {q:`(x+${getR(2,5)})²`}]},
                "因数分解": { gen: () => [{q:`x²+${getR(3,8)}x+${getR(10,20)}`}, {q:`x²-${getR(4,9)}²`}]}
            },
            "2次方程式": {
                "平方根解法": { gen: () => [{q:`x²=${getR(16,81)}`}, {q:`(x-${getR(2,5)})²=${getR(2,9)}`}]},
                "因数分解解法": { gen: () => [{q:`x²-${getR(3,8)}x+${getR(7,15)}=0`}]}
            }
        };

        // メニュー描画（大項目・小項目）
        const menu = document.getElementById('menu-area');
        for(let category in catalog) {
            menu.innerHTML += `<div class="cat-title">${category}</div>`;
            for(let sub in catalog[category]) {
                menu.innerHTML += `<label class="label-group"><input type="checkbox" class="calc-unit" data-cat="${category}" data-sub="${sub}"> ${sub}</label>`;
            }
        }

        function generatePrint() {
            const preview = document.getElementById('main-preview-area');
            preview.innerHTML = '';
            document.querySelectorAll('.calc-unit:checked').forEach(cb => {
                const cat = cb.dataset.cat;
                const sub = cb.dataset.sub;
                const probs = shuffleArray(catalog[cat][sub].gen());
                let html = `<div class="page"><div class="big-question"><h2>${cat}：${sub}</h2><div class="grid">`;
                probs.forEach((p, i) => html += `<div>（${i+1}） ${p.q} ＝ </div>`);
                html += `</div></div></div>`;
                preview.innerHTML += html;
            });
        }
        function resetCheckboxes() {
            document.querySelectorAll('.calc-unit').forEach(cb => cb.checked = false);
            document.getElementById('main-preview-area').innerHTML = '';
        }
    </script>
</body>
</html>
