<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>中学数学計算 全70単元網羅ジェネレーター</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f0f2f5; }
        .sidebar { width: 300px; background: #fff; overflow-y: auto; padding: 20px; border-right: 1px solid #ccc; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .page { width: 210mm; min-height: 297mm; background: #fff; padding: 20mm; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; box-sizing: border-box; }
        .big-question { border-bottom: 1px solid #333; margin-bottom: 20px; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 14px; }
        .btn { padding: 10px; margin-top: 10px; width: 100%; cursor: pointer; border: none; background: #3182ce; color: #fff; border-radius: 4px; }
        .btn-reset { background: #e53e3e; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>全70単元選択</h3>
        <div id="menu-area"></div>
        <button class="btn" onclick="generatePrint()">🔄 数値変更して再生成</button>
        <button class="btn btn-reset" onclick="resetCheckboxes()">🧹 全リセット</button>
    </div>
    <div class="main-content" id="main-preview-area"></div>

    <script>
        const getR = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        
        // 70単元分のロジック定義
        const sectionCatalog = {
            "m1_1_加減": { title: "1-1 正負の数の加減（全パターン）", generator: () => shuffleArray([
                { q: `${getR(2,9)} + (${-getR(2,9)})`, steps: ["符号を整理して加える"] },
                { q: `${-getR(2,9)} + ${getR(2,9)}`, steps: ["符号を整理して加える"] },
                { q: `${-getR(2,9)} + (${-getR(2,9)})`, steps: ["負の数どうしの加法"] },
                { q: `${getR(2,9)} - ${getR(2,9)}`, steps: ["正－正の減法"] },
                { q: `${-getR(2,9)} - (${-getR(2,9)})`, steps: ["負－負の減法（足し算に直す）"] }
            ])},
            "m1_1_カッコなし式": { title: "1-1 カッコのない式への変形", generator: () => shuffleArray([
                { q: `${getR(2,9)} - ${getR(2,9)} + (${-getR(2,9)}) - (${-getR(2,9)})`, steps: ["カッコを外して加法だけの式にする"] }
            ])},
            "m1_1_加減混合": { title: "1-1 加減の混じった計算", generator: () => shuffleArray([
                { q: `${getR(2,9)} - (${-getR(2,9)}) + (${-getR(2,9)}) - ${getR(2,9)}`, steps: ["符号を整理して計算する"] },
                { q: `${getR(2,9)} + ${getR(2,9)} - ${getR(2,9)} - ${getR(2,9)}`, steps: ["左から順に計算する"] },
                { q: `${getR(2,9)} - (${-getR(2,9)}) - ${getR(2,9)} - ${getR(2,9)}`, steps: ["負の引き算に注意"] }
            ])},
            "m1_1_乗法": { title: "1-1 乗法（全符号パターン）", generator: () => shuffleArray([
                { q: `${getR(2,9)} × ${getR(2,9)}`, steps: ["正×正"] },
                { q: `(${ -getR(2,9)}) × (${-getR(2,9)})`, steps: ["負×負"] },
                { q: `${getR(2,9)} × (${-getR(2,9)})`, steps: ["正×負"] },
                { q: `(${ -getR(2,9)}) × ${getR(2,9)}`, steps: ["負×正"] },
                { q: `(${ -getR(2,9)}) × (${-getR(2,9)}) × ${getR(2,9)} × (${-getR(2,9)})`, steps: ["マイナスの個数を数える"] }
            ])},
            "m1_1_累乗表記": { title: "1-1 累乗で表す", generator: () => shuffleArray([
                { q: `${getR(2,9)} × ${getR(2,9)} × ${getR(2,9)}`, steps: ["指数を使って表す"] },
                { q: `(-${getR(2,9)}) × (-${getR(2,9)})`, steps: ["括弧に注意"] }
            ])},
            "m1_1_累乗計算": { title: "1-1 累乗の計算", generator: () => shuffleArray([
                { q: `(-${getR(2,5)})²`, steps: ["(-a)²=a²"] },
                { q: `-${getR(2,5)}²`, steps: ["-a²=-(a×a)"] },
                { q: `(-${getR(2,4)})³`, steps: ["(-a)³=-a³"] }
            ])},
            "m1_1_逆数": { title: "1-1 逆数", generator: () => shuffleArray([
                { q: `-<div class="frac"><div class="num">3</div><div class="den">4</div></div> の逆数`, steps: ["分母と分子を入れ替える"] },
                { q: `${getR(2,9)} の逆数`, steps: ["整数は分数に直す"] },
                { q: `0.${getR(1,9)} の逆数`, steps: ["小数は分数に直す"] }
            ])},
            "m1_1_除法": { title: "1-1 除法（逆数にする計算）", generator: () => shuffleArray([
                { q: `${getR(2,9)} ÷ (${-getR(2,9)})`, steps: ["逆数のかけ算にする"] },
                { q: `-${getR(2,9)} ÷ (${-getR(2,9)})`, steps: ["負÷負＝正"] },
                { q: `<div class="frac"><div class="num">2</div><div class="den">3</div></div> ÷ (-<div class="frac"><div class="num">1</div><div class="den">4</div></div>)`, steps: ["分数÷分数"] },
                { q: `-<div class="frac"><div class="num">3</div><div class="den">5</div></div> ÷ ${getR(2,5)}`, steps: ["分数÷整数"] }
            ])},
            "m1_1_乗除混合": { title: "1-1 乗除の混じった計算", generator: () => shuffleArray([
                { q: `<div class="frac"><div class="num">2</div><div class="den">3</div></div> ÷ (-<div class="frac"><div class="num">4</div><div class="den">5</div></div>) × (${-getR(2,5)})`, steps: ["すべて掛け算に直す"] },
                { q: `(-${getR(2,4)})² × (${-getR(2,4)})²`, steps: ["累乗を先に計算"] },
                { q: `(-${getR(10,20)}) ÷ (-${getR(2,5)})² × ${getR(2,5)}`, steps: ["累乗→乗除の順"] }
            ])},
            "m1_1_四則混合": { title: "1-1 四則の混じった計算", generator: () => shuffleArray([
                { q: `(-${getR(2,5)}) × ${getR(2,5)} - ${getR(2,5)} ÷ (-${getR(2,5)})`, steps: ["掛け算・割り算を先に行う"] },
                { q: `${getR(5,9)} ÷ (${getR(2,4)} + (-${getR(2,4)})) + (${-getR(2,5)})`, steps: ["カッコ内が先"] },
                { q: `(-${getR(2,5)}) × (<div class="frac"><div class="num">1</div><div class="den">3</div></div> - <div class="frac"><div class="num">1</div><div class="den">2</div></div>)`, steps: ["分数計算"] },
                { q: `${getR(2,5)} × (-${getR(2,5)}) - ${getR(2,5)} × (-${getR(2,5)})`, steps: ["共通因数で分配法則を利用"] }
            ])}
        };

        // メニュー生成
        const menu = document.getElementById('menu-area');
        for(let key in catalog) {
            menu.innerHTML += `<div class="label-group"><input type="checkbox" class="calc-unit" value="${key}" onchange="generatePrint()"> ${catalog[key].title}</div>`;
        }

        function generatePrint() {
            const preview = document.getElementById('main-preview-area');
            preview.innerHTML = '';
            document.querySelectorAll('.calc-unit:checked').forEach(cb => {
                const item = catalog[cb.value];
                if(item) {
                    const problems = item.gen();
                    let html = `<div class="page"><div class="big-question"><h2>${item.title}</h2><div class="grid">`;
                    problems.forEach((p, i) => html += `<div>（${i+1}） ${p.q} ＝ </div>`);
                    html += `</div></div></div>`;
                    preview.innerHTML += html;
                }
            });
        }
        function resetCheckboxes() {
            document.querySelectorAll('.calc-unit').forEach(cb => cb.checked = false);
            document.getElementById('main-preview-area').innerHTML = '';
        }
    </script>
</body>
</html>
